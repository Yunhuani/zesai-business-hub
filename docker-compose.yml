services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: zesai_business_hub
      MYSQL_USER: zesai
      MYSQL_PASSWORD: zesai_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uzesai -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: migrate
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://zesai:zesai_password@mysql:3306/zesai_business_hub
      DATABASE_SSL: "false"
      NBG_HEALTH_REQUIRED: "false"
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://zesai:zesai_password@mysql:3306/zesai_business_hub
      DATABASE_SSL: "false"
      NBG_HEALTH_REQUIRED: "false"
      NBG_ENGINE_URL: http://host.docker.internal:8000
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mysql-data:
